name: Version bump
on:
  pull_request:
  push:
    branches: [main, 'desktop-*']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin files changed only with a new version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            branch="${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            branch="${{ github.ref_name }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # The first push of a branch: nothing to compare, but the version must still belong to the branch.
            node tools/check-version-bump.js HEAD "$branch"
            exit 0
          fi
          node tools/check-version-bump.js "$base" "$branch"
